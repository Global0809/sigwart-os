<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070812">
<title>Aarohi &amp; Vivaan — A Universe, Assembled</title>
<style>
/* ============================================================
   VOXEL VOWS — a universe assembled one block at a time
   ============================================================ */
:root{
  --ink:#f5eede;
  --gold:#ffc46b;
  --gold-hi:#ffe3ae;
  --rose:#ff7ea8;
  --teal:#5be3c8;
  --cyan:#8fe8ff;
  --violet:#b19bff;
  --bg:#070812;
  --glass:rgba(13,15,30,.55);
  --line:rgba(255,196,107,.28);
  --serif:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --sans:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:auto}
html,body{background:var(--bg)}
body{
  font-family:var(--sans); color:var(--ink);
  overflow-x:hidden; cursor:none;
  -webkit-font-smoothing:antialiased;
}
@media (pointer:coarse){ body{cursor:auto} }
a,button{cursor:none}
@media (pointer:coarse){ a,button{cursor:pointer} }
::selection{background:rgba(255,196,107,.35)}
/* hide native scrollbar, keep scrolling */
html{scrollbar-width:none}
body::-webkit-scrollbar,html::-webkit-scrollbar{display:none;width:0}

#spacer{position:relative;width:100%;height:1500vh;pointer-events:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:1}

/* film vignette + grade */
#vignette{position:fixed;inset:0;z-index:3;pointer-events:none;
  background:
    radial-gradient(120% 90% at 50% 42%, transparent 55%, rgba(2,3,10,.55) 100%),
    linear-gradient(to bottom, rgba(3,4,12,.35), transparent 14%, transparent 86%, rgba(3,4,12,.45));
}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:26px;transition:opacity .9s ease, visibility .9s}
#loader.done{opacity:0;visibility:hidden}
.seed{width:22px;height:22px;background:linear-gradient(135deg,var(--gold-hi),var(--gold) 55%,#c77b2e);
  box-shadow:0 0 24px 4px rgba(255,196,107,.55), 0 0 90px 18px rgba(255,150,60,.25);
  animation:seedspin 2.1s cubic-bezier(.6,.05,.3,.95) infinite}
@keyframes seedspin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(225deg) scale(1.25)}100%{transform:rotate(360deg) scale(1)}}
#loader .ll{font-family:var(--serif);font-size:15px;letter-spacing:.42em;text-transform:uppercase;color:rgba(245,238,222,.72);padding-left:.42em}
#lbar{width:172px;height:2px;background:rgba(255,255,255,.10);overflow:hidden}
#lbar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--rose));transition:width .25s ease}

/* ---------- chrome ---------- */
.chrome{position:fixed;z-index:20;pointer-events:none;opacity:0;transition:opacity 1.2s ease .3s}
body.ready .chrome{opacity:1}
#mono{top:26px;left:30px;font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:.34em;color:var(--gold);text-shadow:0 0 18px rgba(255,196,107,.5)}
#mono span{color:var(--rose)}
#topline{top:31px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.5em;text-transform:uppercase;color:rgba(245,238,222,.5);padding-left:.5em;white-space:nowrap}

#sndBtn{position:fixed;top:22px;right:26px;z-index:30;pointer-events:auto;width:40px;height:40px;
  background:var(--glass);border:1px solid var(--line);color:var(--gold);
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:box-shadow .3s, color .3s}
#sndBtn:hover{box-shadow:0 0 18px rgba(255,196,107,.35)}
#sndBtn svg{width:18px;height:18px;fill:currentColor}
#sndBtn .on-i{display:none}
#sndBtn.on .on-i{display:block} #sndBtn.on .off-i{display:none}
#sndBtn.on{color:var(--gold-hi);box-shadow:0 0 22px rgba(255,196,107,.4)}

/* ---------- right rail nav ---------- */
#rail{position:fixed;right:26px;top:50%;transform:translateY(-50%);z-index:25;display:flex;flex-direction:column;gap:13px;pointer-events:auto}
#rail .dot{position:relative;width:9px;height:9px;border:1px solid rgba(245,238,222,.35);background:transparent;
  transition:all .35s ease;pointer-events:auto}
#rail .dot:hover{border-color:var(--gold)}
#rail .dot.active{background:var(--gold);border-color:var(--gold);box-shadow:0 0 14px rgba(255,196,107,.8);transform:rotate(45deg)}
#rail .dot i{position:absolute;right:22px;top:50%;transform:translateY(-50%);font-style:normal;font-size:10px;letter-spacing:.28em;
  text-transform:uppercase;color:var(--gold);white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none}
#rail .dot.active i, #rail .dot:hover i{opacity:.95}
@media (max-width:760px){ #rail{right:12px;gap:10px} #rail .dot i{display:none} }

/* ---------- intro ---------- */
.stage{position:fixed;inset:0;z-index:10;pointer-events:none}
#intro{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:9vh;text-align:center}
#intro .pre{font-size:11px;letter-spacing:.55em;text-transform:uppercase;color:rgba(245,238,222,.6);padding-left:.55em}
#intro h1{font-family:var(--serif);font-weight:600;font-size:clamp(30px,5.6vw,58px);letter-spacing:.06em;margin:14px 0 6px;
  background:linear-gradient(100deg,var(--gold-hi) 10%,var(--gold) 38%,var(--rose) 62%,var(--gold-hi) 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(255,180,90,.28))}
#intro .sub{font-family:var(--serif);font-style:italic;font-size:clamp(15px,2vw,20px);color:rgba(245,238,222,.78)}
#hint{margin-top:4.5vh;display:flex;flex-direction:column;align-items:center;gap:10px}
#hint .ht{font-size:10px;letter-spacing:.5em;text-transform:uppercase;color:rgba(245,238,222,.55);padding-left:.5em}
#hint .chev{width:12px;height:12px;border-right:1px solid var(--gold);border-bottom:1px solid var(--gold);transform:rotate(45deg);
  animation:chev 1.8s ease infinite}
@keyframes chev{0%,100%{transform:translateY(0) rotate(45deg);opacity:.9}50%{transform:translateY(9px) rotate(45deg);opacity:.3}}
#tourBtn{margin-top:22px;pointer-events:auto;background:transparent;border:1px solid var(--line);color:var(--gold);
  font-family:var(--sans);font-size:10px;letter-spacing:.4em;text-transform:uppercase;padding:12px 22px 12px 26px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:all .3s}
#tourBtn:hover{box-shadow:0 0 24px rgba(255,196,107,.3);color:var(--gold-hi)}

/* ---------- chapter titles ---------- */
.chapter{position:fixed;z-index:10;pointer-events:none;max-width:min(560px,86vw);opacity:0}
.chapter .eyebrow{font-size:10px;letter-spacing:.55em;text-transform:uppercase;color:var(--gold);margin-bottom:14px;display:flex;align-items:center;gap:14px}
.chapter .eyebrow::before{content:"";width:34px;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.chapter h2{font-family:var(--serif);font-weight:600;font-size:clamp(30px,4.6vw,54px);line-height:1.06;letter-spacing:.015em;
  color:var(--ink);text-shadow:0 2px 30px rgba(0,0,0,.6)}
.chapter h2 em{font-style:italic;background:linear-gradient(100deg,var(--gold-hi),var(--gold) 45%,var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
.chapter .body{margin-top:14px;font-family:var(--serif);font-style:italic;font-size:clamp(15px,1.8vw,19px);color:rgba(245,238,222,.76);line-height:1.5}
.chapter.left{left:6vw;top:50%;transform:translateY(-50%)}
.chapter.right{right:6vw;top:50%;transform:translateY(-50%);text-align:right}
.chapter.right .eyebrow{flex-direction:row-reverse}
.chapter.right .eyebrow::before{background:linear-gradient(270deg,var(--gold),transparent)}
.chapter.bottom{left:50%;bottom:8vh;transform:translateX(-50%);text-align:center}
.chapter.bottom .eyebrow{justify-content:center}
@media (max-width:760px){
  .chapter.left,.chapter.right{left:7vw;right:7vw;top:auto;bottom:9vh;transform:none;text-align:left}
  .chapter.right .eyebrow{flex-direction:row}
}

/* ---------- event cards ---------- */
.ecard{position:fixed;z-index:10;pointer-events:none;opacity:0;
  width:min(400px,86vw);padding:26px 28px;background:var(--glass);
  border:1px solid var(--line);border-top:2px solid var(--gold);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 30px 80px rgba(0,0,0,.5)}
.ecard .eyebrow{font-size:9px;letter-spacing:.5em;text-transform:uppercase;color:var(--gold);opacity:.9}
.ecard h3{font-family:var(--serif);font-weight:600;font-size:clamp(30px,3.6vw,42px);margin:8px 0 4px;letter-spacing:.02em}
.ecard .blurb{font-family:var(--serif);font-style:italic;font-size:15px;color:rgba(245,238,222,.7);margin-bottom:16px;line-height:1.45}
.ecard .row{display:flex;gap:12px;align-items:baseline;padding:7px 0;border-top:1px dashed rgba(245,238,222,.14);font-size:13px}
.ecard .row b{font-weight:600;color:var(--gold-hi);min-width:64px;font-size:10px;letter-spacing:.28em;text-transform:uppercase}
.ecard.left{left:6vw;top:50%;transform:translateY(-50%)}
.ecard.right{right:6vw;top:50%;transform:translateY(-50%)}
@media (max-width:760px){ .ecard.left,.ecard.right{left:50%;right:auto;top:auto;bottom:7vh;transform:translateX(-50%)} }

/* ---------- finale ---------- */
#finale{position:fixed;inset:0;z-index:12;display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:5vh;pointer-events:none;opacity:0}
#finale .card{width:min(560px,90vw);max-height:72vh;overflow-y:auto;scrollbar-width:none;
  text-align:center;padding:34px 34px 28px;background:rgba(10,11,24,.66);
  border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 40px 120px rgba(0,0,0,.6), inset 0 0 60px rgba(255,196,107,.04)}
#finale .card::-webkit-scrollbar{display:none}
#finale .fm{font-family:var(--serif);font-size:15px;letter-spacing:.5em;color:var(--rose);padding-left:.5em}
#finale h2{font-family:var(--serif);font-weight:600;font-size:clamp(34px,6vw,54px);letter-spacing:.04em;margin:10px 0 2px;
  background:linear-gradient(100deg,var(--gold-hi) 5%,var(--gold) 40%,var(--rose) 70%,var(--gold-hi) 95%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
#finale .fam{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(245,238,222,.6);margin:10px 0 4px;line-height:1.8}
#finale .inv{font-family:var(--serif);font-style:italic;font-size:17px;color:rgba(245,238,222,.85)}
#finale .date{font-family:var(--serif);font-size:clamp(22px,3.4vw,30px);color:var(--gold-hi);letter-spacing:.14em;margin:16px 0 2px}
#finale .venue{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:rgba(245,238,222,.7)}
#finale .sched{margin:20px 0 6px;border-top:1px solid rgba(255,196,107,.2)}
#finale .srow{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px dashed rgba(245,238,222,.12);font-size:12.5px}
#finale .srow .n{font-family:var(--serif);font-size:16px;color:var(--gold);letter-spacing:.05em;text-align:left}
#finale .srow .w{color:rgba(245,238,222,.75);text-align:right;line-height:1.5}
#finale .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px;pointer-events:auto}
#finale .btn{display:inline-block;pointer-events:auto;text-decoration:none;font-size:10px;letter-spacing:.34em;text-transform:uppercase;
  padding:13px 22px 13px 25px;border:1px solid var(--gold);color:#1a1206;font-weight:600;
  background:linear-gradient(120deg,var(--gold-hi),var(--gold));transition:all .3s}
.btn.ghost{background:transparent;color:var(--gold)}
.btn:hover{box-shadow:0 0 26px rgba(255,196,107,.45)}
#finale .foot{margin-top:18px;font-size:10.5px;letter-spacing:.14em;color:rgba(245,238,222,.42);font-style:italic}

/* ---------- custom cursor ---------- */
#cur,#curRing{position:fixed;z-index:50;pointer-events:none;top:0;left:0;opacity:0}
#cur{width:6px;height:6px;background:var(--gold-hi);box-shadow:0 0 12px 2px rgba(255,220,150,.9)}
#curRing{width:30px;height:30px;border:1px solid rgba(255,196,107,.5);transform:rotate(45deg)}
@media (pointer:coarse){ #cur,#curRing{display:none} }

#fallback{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--bg)}
#fallback .card{max-width:520px;border:1px solid var(--line);padding:40px}
</style>
</head>
<body>
<div id="spacer"></div>
<canvas id="c"></canvas>
<div id="vignette"></div>

<div id="loader">
  <div class="seed"></div>
  <div class="ll">Assembling your universe</div>
  <div id="lbar"><i></i></div>
</div>

<div id="mono" class="chrome">A<span>&nbsp;&#9829;&nbsp;</span>V</div>
<div id="topline" class="chrome">The Wedding Of Aarohi &amp; Vivaan</div>
<button id="sndBtn" class="chrome" aria-label="toggle sound">
  <svg class="off-i" viewBox="0 0 24 24"><path d="M4 9v6h4l6 5V4L8 9H4zm14.6 3l2.9-2.9-1.4-1.4-2.9 2.9-2.9-2.9-1.4 1.4 2.9 2.9-2.9 2.9 1.4 1.4 2.9-2.9 2.9 2.9 1.4-1.4-2.9-2.9z"/></svg>
  <svg class="on-i" viewBox="0 0 24 24"><path d="M4 9v6h4l6 5V4L8 9H4zm12.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4zM14 2.2v2.1c2.9.9 5 3.5 5 6.7s-2.1 5.8-5 6.7v2.1c4-.9 7-4.5 7-8.8s-3-7.9-7-8.8z"/></svg>
</button>
<div id="rail" class="chrome"></div>

<div id="ui"></div>

<div id="finale">
  <div class="card" id="finaleCard"></div>
</div>

<div id="cur"></div><div id="curRing"></div>

<div id="fallback"><div class="card">
  <h1 style="font-family:var(--serif)">Aarohi &amp; Vivaan</h1>
  <p style="margin-top:12px;opacity:.8">are getting married &mdash; 12 December 2026, Amaya Palace, Udaipur.<br><br>
  This invitation is a real-time 3D universe and needs WebGL.<br>Please open it in a modern browser.</p>
</div></div>

<script type="importmap">
{ "imports": { "three": "../lib/three/three.module.min.js", "three/addons/": "../lib/three/addons/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }     from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }     from 'three/addons/postprocessing/OutputPass.js';

/* ================================================================
   CONFIG — edit everything about the wedding here
   ================================================================ */
const CONFIG = {
  bride:'Aarohi', groom:'Vivaan',
  families:'With the blessings of the Sharma & Kapoor families',
  dateBig:'12 · 12 · 2026',
  venue:'Amaya Palace', city:'Udaipur, Rajasthan',
  rsvpEmail:'rsvp@aarohiandvivaan.love',
  events:[
    {key:'haldi',    name:'Haldi',     date:'Thursday, 10 December 2026', time:'10:00 am', venue:'The Marigold Courtyard', ics:['20261210T100000','20261210T130000'],
     blurb:'Turmeric, laughter, and ten thousand golden blocks.'},
    {key:'mehendi',  name:'Mehendi',   date:'Thursday, 10 December 2026', time:'4:00 pm',  venue:'The Jaali Terrace', ics:['20261210T160000','20261210T200000'],
     blurb:'Vines of henna, grown one tile at a time.'},
    {key:'sangeet',  name:'Sangeet',   date:'Friday, 11 December 2026',   time:'7:00 pm',  venue:'The Neon Durbar', ics:['20261211T190000','20261211T233000'],
     blurb:'The night the whole universe dances.'},
    {key:'wedding',  name:'The Pheras',date:'Saturday, 12 December 2026', time:'7:00 pm',  venue:'The Grand Mandap', ics:['20261212T190000','20261212T220000'],
     blurb:'Seven steps around a fire made of light.'},
    {key:'reception',name:'Reception', date:'Saturday, 12 December 2026', time:'9:00 pm',  venue:'The Skyline Court', ics:['20261212T210000','20261213T000000'],
     blurb:'A new city, and it is ours.'},
  ],
};

/* ---------- section metadata (10 sections, equal scroll spans) ---------- */
const NS = 10, S = 1/NS;
const SECTIONS = [
  {label:'Begin',      fog:0x070812},
  {label:'The Names',  fog:0x0a0918},
  {label:'A World',    fog:0x081018},
  {label:'The Couple', fog:0x120b18},
  {label:'Haldi',      fog:0x171006},
  {label:'Mehendi',    fog:0x061410},
  {label:'Sangeet',    fog:0x10061a},
  {label:'Pheras',     fog:0x190a06},
  {label:'Reception',  fog:0x05070f},
  {label:'Invitation', fog:0x070812},
];
const BURST_COLORS = [0xffc46b,0xffc46b,0x8fe8ff,0xff7ea8,0xffd34e,0x5be3c8,0xe05bff,0xff9a3d,0x8fe8ff,0xffc46b];

/* ================================================================
   DOM — chapters, event cards, rail, finale
   ================================================================ */
const ui = document.getElementById('ui');
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }

const intro = el(`<div class="stage" id="intro">
  <div class="pre">You are invited to the wedding of</div>
  <h1>${CONFIG.bride} &amp; ${CONFIG.groom}</h1>
  <div class="sub">${CONFIG.dateBig} &nbsp;·&nbsp; ${CONFIG.venue}, ${CONFIG.city}</div>
  <div id="hint"><div class="ht">Scroll to build the universe</div><div class="chev"></div></div>
  <button id="tourBtn">&#9656;&nbsp; Cinematic tour</button>
</div>`);
ui.appendChild(intro);

const CHAPTERS = [
  null, // s0 uses #intro
  {pos:'bottom', eyebrow:'The Announcement', h:`Two names, written in <em>light</em>`, body:`Every love story begins with a single block.`},
  {pos:'left',   eyebrow:'Chapter One — Genesis', h:`A world <em>assembles</em> itself`, body:`Islands rise. Rivers crystallise. Bridges find their far shore — the way we found each other.`},
  {pos:'right',  eyebrow:'Chapter Two — The Couple', h:`Ten thousand blocks.<br>One <em>heart</em>.`, body:`Watch us take shape — voxel by voxel, the way love actually happens: slowly, then all at once.`},
  null,null,null,null,null, // s4–s8 use event cards
  null, // s9 finale
];
const chapterEls = CHAPTERS.map((c)=>{
  if(!c) return null;
  const n = el(`<div class="chapter ${c.pos}">
    <div class="eyebrow">${c.eyebrow}</div><h2>${c.h}</h2><div class="body">${c.body}</div></div>`);
  ui.appendChild(n); return n;
});

const EVENT_SECTION = {4:0, 5:1, 6:2, 7:3, 8:4}; // section idx -> CONFIG.events idx
const CHAPTER_NAMES = ['','','','','Chapter Three','Chapter Four','Chapter Five','Chapter Six','Chapter Seven'];
const eventEls = {};
Object.entries(EVENT_SECTION).forEach(([sec,evi],i)=>{
  const ev = CONFIG.events[evi];
  const side = (i%2===0)?'left':'right';
  const n = el(`<div class="ecard ${side}">
    <div class="eyebrow">${CHAPTER_NAMES[sec]} — The Celebrations</div>
    <h3>${ev.name}</h3>
    <div class="blurb">${ev.blurb}</div>
    <div class="row"><b>When</b><span>${ev.date}</span></div>
    <div class="row"><b>Time</b><span>${ev.time}</span></div>
    <div class="row"><b>Where</b><span>${ev.venue} · ${CONFIG.venue}</span></div>
  </div>`);
  ui.appendChild(n); eventEls[sec]=n;
});

/* rail */
const rail = document.getElementById('rail');
const dots = SECTIONS.map((s,i)=>{
  const d = el(`<button class="dot" aria-label="${s.label}"><i>${s.label}</i></button>`);
  d.addEventListener('click',()=>{ tourOff(); smoothJumpTo((i*S)+0.045); });
  rail.appendChild(d); return d;
});

/* finale card + ICS */
function buildICS(){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//VoxelVows//EN'];
  CONFIG.events.forEach(ev=>{
    L.push('BEGIN:VEVENT',`UID:${ev.key}@voxelvows`,`DTSTART:${ev.ics[0]}`,`DTEND:${ev.ics[1]}`,
      `SUMMARY:${ev.name} — ${CONFIG.bride} & ${CONFIG.groom}`,
      `LOCATION:${ev.venue}, ${CONFIG.venue}, ${CONFIG.city}`,'END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return 'data:text/calendar;charset=utf-8,'+encodeURIComponent(L.join('\r\n'));
}
const finale = document.getElementById('finale');
document.getElementById('finaleCard').innerHTML = `
  <div class="fm">A &#9829; V</div>
  <h2>${CONFIG.bride} &amp; ${CONFIG.groom}</h2>
  <div class="fam">${CONFIG.families}</div>
  <div class="inv">request the honour of your presence</div>
  <div class="date">${CONFIG.dateBig}</div>
  <div class="venue">${CONFIG.venue} · ${CONFIG.city}</div>
  <div class="sched">${CONFIG.events.map(ev=>`
    <div class="srow"><span class="n">${ev.name}</span><span class="w">${ev.date.split(', ')[1]} · ${ev.time}<br>${ev.venue}</span></div>`).join('')}
  </div>
  <div class="btns">
    <a class="btn" href="mailto:${CONFIG.rsvpEmail}?subject=RSVP%20—%20${CONFIG.bride}%20%26%20${CONFIG.groom}">RSVP</a>
    <a class="btn ghost" href="${buildICS()}" download="${CONFIG.bride}-${CONFIG.groom}-Wedding.ics">Add to calendar</a>
    <a class="btn ghost" href="#" id="replayBtn">Rebuild&nbsp;&#8635;</a>
  </div>
  <div class="foot" id="finFoot"></div>`;

/* ================================================================
   THE VOXEL SHADER — one material to rule every block
   ================================================================ */
const VSH = `
uniform float uTime, uProgress, uSuck, uScatterR, uSwirl, uFloatAmp, uSpin;
uniform float uEq, uEqBase, uBeat, uBeatGlow, uMouseR, uPop;
uniform vec3  uSuckPoint, uMouse, uCenter;
uniform vec4  uClick;   // xyz local, w = click time (uTime units), -1e3 when idle
uniform vec4  uFlow;    // mode(0/1 fall/2 rise), speed, range, baseY
attribute vec3 aTarget;
attribute vec3 aColor;
attribute vec4 aData;   // scale, delay, emissive, seed
varying vec3 vColor; varying float vEmissive; varying vec3 vWorldPos; varying vec3 vNormalW; varying vec2 vUv;

vec3 hash31(float p){
  vec3 p3 = fract(vec3(p) * vec3(.1031,.1030,.0973));
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.xxy + p3.yzz) * p3.zyx);
}
mat3 rotAxis(vec3 a, float r){
  float s=sin(r), c=cos(r), o=1.-c;
  return mat3(o*a.x*a.x+c, o*a.x*a.y+a.z*s, o*a.x*a.z-a.y*s,
              o*a.y*a.x-a.z*s, o*a.y*a.y+c, o*a.y*a.z+a.x*s,
              o*a.z*a.x+a.y*s, o*a.z*a.y-a.x*s, o*a.z*a.z+c);
}
void main(){
  float seed = aData.w;
  vec3 rnd = hash31(seed);

  // staggered local progress: each block spends ~30% of the timeline flying in
  float lp = clamp((uProgress - aData.y*0.7) / 0.3, 0.0, 1.0);
  float e  = lp*lp*(3.0-2.0*lp);

  // scatter origin: random shell around target, optionally sucked to a single point
  vec3 dir  = normalize(rnd - 0.5 + 1e-4);
  vec3 scat = aTarget + dir * (uScatterR * (0.35 + rnd.x));
  scat = mix(scat, uSuckPoint, uSuck);

  // swirl the in-flight cloud around the group's centre
  float ang = (1.0-e) * uSwirl * (0.5 + rnd.y);
  vec3 rel = scat - uCenter;
  float ca=cos(ang), sa=sin(ang);
  rel.xz = mat2(ca,-sa,sa,ca) * rel.xz;
  scat = uCenter + rel;

  vec3 p = mix(scat, aTarget, e);

  // flow: endless fall / rise (waterfalls, petals, embers)
  if(uFlow.x > 0.5){
    float y = aTarget.y - uFlow.w;
    float dn = uFlow.x > 1.5 ? 1.0 : -1.0;
    y = mod(y + dn*uTime*uFlow.y, uFlow.z);
    if(y < 0.0) y += uFlow.z;
    p.y = uFlow.w + y;
  }
  // equaliser columns (sangeet): compress whole columns from a base line
  float eqGlow = 0.0;
  if(uEq > 0.5){
    float f = 0.22 + 0.78 * pow(0.5+0.5*sin(uTime*(2.0+rnd.z*1.6) + seed*43.0), 2.0);
    f *= mix(0.72, 1.28, uBeat);
    p.y = uEqBase + (p.y-uEqBase) * f;
    eqGlow = f * (0.35 + 1.5*uBeat);
  }
  // idle breathing — nothing is ever static
  p += uFloatAmp * e * vec3(sin(uTime*0.9+seed*17.0), sin(uTime*1.2+seed*29.0), sin(uTime*0.7+seed*43.0));

  // cursor field: blocks rise, part, and glow near the pointer
  float md  = distance(p, uMouse);
  float inf = smoothstep(uMouseR, 0.0, md);
  p += normalize(p - uMouse + 1e-4) * inf * 2.3;
  p.y += inf * 1.5;

  // click shockwave
  float clickGlow = 0.0;
  float ct = uTime - uClick.w;
  if(ct > 0.0 && ct < 2.6){
    float cr = ct * 26.0;
    float cd = distance(p, uClick.xyz);
    float band = exp(-pow((cd-cr)/3.4, 2.0)) * (1.0 - ct/2.6);
    p += normalize(p - uClick.xyz + 1e-4) * band * 2.4;
    clickGlow = band * 1.6;
  }

  // per-block tumble while in flight + gentle ambient spin
  float rota = (1.0-e)*(2.0+rnd.x*5.0) + inf*3.5 + uSpin*uTime*(rnd.y-0.5)*2.0;
  vec3 axis = normalize(rnd*2.0-1.0 + 1e-4);
  mat3 R = rotAxis(axis, rota);

  float pop = 1.0 + uPop * sin(e*3.14159) * 0.35;
  float scl = aData.x * e * pop;

  vec3 vtx = R * (position * scl) + p;
  vec4 wp = modelMatrix * vec4(vtx, 1.0);
  gl_Position = projectionMatrix * viewMatrix * wp;

  vWorldPos = wp.xyz;
  vNormalW = normalize(mat3(modelMatrix) * (R * normal));
  vColor = aColor;
  vUv = uv;
  vEmissive = aData.z * (1.0 + 2.2*inf) + clickGlow + eqGlow + uBeatGlow*uBeat*(0.4+0.6*rnd.z);
}`;

const FSH = `
uniform vec3 uFogColor; uniform float uFogDensity;
varying vec3 vColor; varying float vEmissive; varying vec3 vWorldPos; varying vec3 vNormalW; varying vec2 vUv;
void main(){
  vec3 n = normalize(vNormalW);
  vec3 ldir = normalize(vec3(0.45, 0.8, 0.4));
  float dif = max(dot(n, ldir), 0.0);
  float hemi = n.y*0.5+0.5;
  vec3 amb = mix(vec3(0.16,0.14,0.24), vec3(0.36,0.38,0.52), hemi);
  vec2 g = abs(vUv-0.5);
  float edge = smoothstep(0.5, 0.40, max(g.x,g.y));   // beveled brick face
  vec3 col = vColor * (amb + dif*vec3(1.05,0.97,0.85)) * mix(0.55, 1.0, edge);
  col += vColor * vEmissive * (0.72 + 0.28*edge);
  float d = distance(vWorldPos, cameraPosition);
  float f = 1.0 - exp(-uFogDensity*uFogDensity*d*d);
  col = mix(col, uFogColor, clamp(f,0.0,1.0));
  gl_FragColor = vec4(col, 1.0);
}`;

/* ================================================================
   VOXEL ENGINE
   ================================================================ */
const boxGeo = new THREE.BoxGeometry(1,1,1);
const FOG_BASE = 0.0042;
const _c = new THREE.Color();
let seedCounter = 1;

class Parts{
  constructor(){ this.t=[]; this.c=[]; this.d=[]; }
  add(x,y,z,o={}){
    _c.set(o.c ?? 0xffffff);
    this.t.push(x,y,z);
    this.c.push(_c.r,_c.g,_c.b);
    this.d.push(o.s ?? 1, o.d ?? Math.random(), o.e ?? 0, (seedCounter++)*0.6180339887 % 1000);
    return this;
  }
  get count(){ return this.d.length/4; }
}

const groups = [];
let totalVoxels = 0;

function makeGroup(name, parts, o={}){
  const n = parts.count; totalVoxels += n;
  const g = new THREE.InstancedBufferGeometry();
  g.index = boxGeo.index;
  g.setAttribute('position', boxGeo.attributes.position);
  g.setAttribute('normal',   boxGeo.attributes.normal);
  g.setAttribute('uv',       boxGeo.attributes.uv);
  const tA = new THREE.InstancedBufferAttribute(new Float32Array(parts.t),3);
  const cA = new THREE.InstancedBufferAttribute(new Float32Array(parts.c),3);
  const dA = new THREE.InstancedBufferAttribute(new Float32Array(parts.d),4);
  if(o.dynamic){ tA.setUsage(THREE.DynamicDrawUsage); cA.setUsage(THREE.DynamicDrawUsage); dA.setUsage(THREE.DynamicDrawUsage); }
  g.setAttribute('aTarget',tA); g.setAttribute('aColor',cA); g.setAttribute('aData',dA);
  g.instanceCount = n;

  const mat = new THREE.ShaderMaterial({
    vertexShader:VSH, fragmentShader:FSH,
    uniforms:{
      uTime:{value:0}, uProgress:{value:0}, uSuck:{value:o.suck??0},
      uSuckPoint:{value:new THREE.Vector3(...(o.suckPoint??[0,0,0]))},
      uScatterR:{value:o.scatterR??30}, uSwirl:{value:o.swirl??2.2},
      uFloatAmp:{value:o.floatAmp??0.05}, uSpin:{value:o.spin??0},
      uEq:{value:o.eq?1:0}, uEqBase:{value:o.eqBase??0}, uBeat:{value:0}, uBeatGlow:{value:o.beatGlow??0},
      uMouse:{value:new THREE.Vector3(0,-9999,0)}, uMouseR:{value:6},
      uClick:{value:new THREE.Vector4(0,0,0,-1e3)},
      uFlow:{value:new THREE.Vector4(...(o.flow??[0,0,0,0]))},
      uCenter:{value:new THREE.Vector3(0,0,0)},
      uPop:{value:o.pop??1},
      uFogColor:{value:new THREE.Color(0x070812)},
      uFogDensity:{value:FOG_BASE*(o.fogMul??1)},
    }});
  const mesh = new THREE.Mesh(g, mat);
  mesh.frustumCulled = false;
  mesh.position.set(...(o.center??[0,0,0]));
  mesh.visible = false;
  scene.add(mesh);
  const grp = {name, mesh, mat, u:mat.uniforms, section:o.section??0, persist:!!o.persist,
    suckBase:o.suck??0, fogMul:o.fogMul??1, buildRange:o.buildRange??null, rot:o.rot??null, noCollapse:!!o.noCollapse};
  groups.push(grp);
  return grp;
}

/* ---------- helpers ---------- */
const R  = (a=1,b)=> b===undefined ? Math.random()*a : a+Math.random()*(b-a);
const RI = (a,b)=> Math.floor(R(a,b+0.999));
const lerp=(a,b,t)=>a+(b-a)*t;
const ssm=(a,b,t)=>{ t=Math.min(1,Math.max(0,(t-a)/(b-a))); return t*t*(3-2*t); };
const mixC=(a,b,t)=>{ const ca=new THREE.Color(a), cb=new THREE.Color(b); return ca.lerp(cb,t).getHex(); };

function sampleText(text, px=96, step=3, font='900 {px}px "Arial Black", Arial, "Nirmala UI", sans-serif'){
  const cv=document.createElement('canvas');
  const cx=cv.getContext('2d',{willReadFrequently:true});
  const f=font.replace('{px}',px);
  cx.font=f;
  const w=Math.ceil(cx.measureText(text).width)+10, h=Math.ceil(px*1.4);
  cv.width=w; cv.height=h;
  cx.font=f; cx.fillStyle='#fff'; cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText(text,w/2,h/2);
  const d=cx.getImageData(0,0,w,h).data, pts=[];
  for(let y=0;y<h;y+=step)for(let x=0;x<w;x+=step){
    if(d[(y*w+x)*4+3]>120) pts.push({x:(x-w/2)/px, y:(h/2-y)/px});
  }
  return pts;
}
/* place sampled text as voxels; size = height of one em in world units */
function addText(parts, text, cx,cy,cz, size, o={}){
  const px=o.px??96, step=o.step??3;
  const pts=sampleText(text,px,step,o.font);
  if(pts.length<10) return 0;
  const vs=(step/px)*size*1.12;
  for(const p of pts){
    parts.add(cx+p.x*size, cy+p.y*size, cz+(Math.random()-0.5)*vs*0.6,
      {c:o.c??0xffc46b, s:vs, e:o.e??0.9, d:o.dfn? o.dfn(p): (p.x*size+30)/60});
  }
  return pts.length;
}

/* ---- s2: floating islands ---- */
function island(p, cx,cy,cz, rad, o={}){
  const n1=(x,z)=>Math.sin(x*0.53+cz)*Math.cos(z*0.47+cx);
  for(let gx=-rad;gx<=rad;gx++)for(let gz=-rad;gz<=rad;gz++){
    const d=Math.hypot(gx,gz);
    const edge=rad*(0.82+0.22*(0.5+0.5*n1(gx*0.8,gz*0.8)));
    if(d>edge) continue;
    const h=Math.max(0, Math.round(1.6 + n1(gx,gz)*1.6 - (d/edge)*2.2));
    const gy=cy+h;
    const grass=((gx+gz)&1)? 0x4fae55 : 0x3d9448;
    p.add(cx+gx, gy, cz+gz, {c:o.grass??grass, s:1, e:0, d:(d/edge)*0.55+R(0.04)});
    p.add(cx+gx, gy-1, cz+gz, {c:0x6b4f37, s:1, d:(d/edge)*0.55+R(0.08)});
    const depth=(edge-d)*0.85*(0.7+0.6*Math.abs(n1(gx*1.7,gz*1.7)));
    for(let k=2;k<2+depth;k+=1){
      if(k>3 && d<edge-2.5 && Math.random()<0.72) continue;   // hollow core
      p.add(cx+gx, gy-k, cz+gz, {c:mixC(0x5c5470,0x2e2a40,Math.min(1,k/9)), s:1, d:(d/edge)*0.5+k*0.03});
    }
  }
}
function tree(p, x,y,z, h, blossom){
  for(let k=0;k<h;k++) p.add(x,y+k,z,{c:0x7a5236,s:0.9,d:0.3+k*0.05});
  const r=R(1.9,2.7);
  for(let ox=-3;ox<=3;ox++)for(let oy=-3;oy<=3;oy++)for(let oz=-3;oz<=3;oz++){
    const dd=Math.hypot(ox,oy*1.2,oz);
    if(dd>r||Math.random()<0.25) continue;
    let c=((ox+oy+oz)&1)?0x59c465:0x3fa04e, e=0;
    if(blossom&&Math.random()<0.08){c=0xff8fb3;e=0.9;}
    p.add(x+ox,y+h+oy,z+oz,{c,s:R(0.8,1.05),e,d:0.55+dd*0.05+R(0.1)});
  }
}

/* ---- s3: the couple assembles ---- */
function lattice(p, fn, x0,x1,y0,y1,z0,z1, st=0.55){
  for(let y=y0;y<=y1;y+=st)for(let x=x0;x<=x1;x+=st)for(let z=z0;z<=z1;z+=st){
    const r=fn(x,y,z); if(r) p.add(x,y,z,Object.assign({s:st*1.02},r));
  }
}
function buildCouple(){
  const p=new Parts();
  // platform: three stepped discs
  [[9,0,0x2c2440],[7.4,1,0x3a2f55],[5.8,2,0x4a3c6e]].forEach(([rr,lvl,cc])=>{
    for(let gx=-rr;gx<=rr;gx++)for(let gz=-rr;gz<=rr;gz++){
      const d=Math.hypot(gx,gz); if(d>rr) continue;
      const rim=d>rr-1.2;
      p.add(gx,lvl,gz,{c:rim?0xffc46b:cc,s:1,e:rim?0.75:0.04,d:d/rr*0.4+lvl*0.06});
    }
  });
  const BY=3;      // figures stand on top tier
  const delayY=y=>0.25+((y-BY)/13)*0.6;
  // GROOM (left)
  const gX=-3.1;
  lattice(p,(x,y,z)=>{
    const ly=y-BY, lx=x-gX;
    const rr=Math.hypot(lx,z);
    if(ly>=0&&ly<5.4){ const rad=1.55-ly*0.045; if(rr<rad) return {c:(Math.abs((lx*2.7+ly*1.8)%2)<0.5)?0x5be3c8:0xf3ead2, e:0.16, d:delayY(y)}; }
    if(ly>=5.4&&ly<8.6){ const rad=lerp(1.5,0.95,(ly-5.4)/3.2); if(rr<rad) return {c:0xf3ead2, e:0.16, d:delayY(y)}; }
    if(ly>=9.0&&ly<10.7){ if(Math.hypot(lx,(ly-9.85)*1.15,z)<0.95) return {c:0xf0d9b8, e:0.2, d:delayY(y)}; }
    if(ly>=10.7&&ly<12.1){ if(Math.hypot(lx,(ly-11.2)*1.5,z)<1.18) return {c:0xd8452e, e:0.32, d:delayY(y)}; }
    return null;
  },gX-2.2,gX+2.2,BY,BY+12.4,-2.2,2.2);
  p.add(gX+0.3,BY+12.2,0.8,{c:0xffe3ae,s:0.5,e:2.2,d:0.9});       // kalgi jewel
  // BRIDE (right)
  const bX=3.1;
  lattice(p,(x,y,z)=>{
    const ly=y-BY, lx=x-bX;
    const rr=Math.hypot(lx,z);
    if(ly>=0&&ly<6.2){ const rad=3.1-ly*0.42; if(rr<Math.max(0.7,rad)){
      const band=Math.abs((ly*2)%2)<0.6;
      return {c:band?0xffc46b:0xd8452e, e:band?0.5:0.18, d:delayY(y)}; } }
    if(ly>=6.2&&ly<9.0){ const rad=lerp(1.05,0.8,(ly-6.2)/2.8); if(rr<rad) return {c:0xd8452e, e:0.2, d:delayY(y)}; }
    if(ly>=9.3&&ly<10.9){ if(Math.hypot(lx,(ly-10.05)*1.15,z)<0.9) return {c:0xf0d9b8, e:0.2, d:delayY(y)}; }
    return null;
  },bX-3.4,bX+3.4,BY,BY+11.2,-3.4,3.4);
  // bride's dupatta: arc from head back over the lehenga
  for(let i=0;i<=17;i++){
    const u=i/17;
    const dx=bX+Math.sin(u*2.6)*1.9, dy=BY+10.9-u*7.6, dz=-0.9-u*1.1;
    for(let k=0;k<2;k++) p.add(dx+R(-0.3,0.3),dy+R(-0.2,0.2),dz+R(-0.25,0.25),{c:0xff7ea8,s:0.55,e:0.55,d:0.55+u*0.35});
  }
  // jewellery
  for(let a=0;a<10;a++){ const th=a/10*Math.PI*2; p.add(bX+Math.cos(th)*0.75,BY+9.15,Math.sin(th)*0.75,{c:0xffe3ae,s:0.3,e:1.8,d:0.85}); }
  p.add(bX,BY+10.9,0.75,{c:0xffe3ae,s:0.35,e:2.2,d:0.9});
  // joined hands + rising hearts
  for(let i=0;i<=8;i++){ const u=i/8; p.add(lerp(gX+1.3,bX-1.0,u),BY+5.6+Math.sin(u*Math.PI)*0.5,0.4,{c:0xf0d9b8,s:0.5,e:0.35,d:0.8+u*0.05}); }
  const heart=[[0,0],[ -1,1],[1,1],[-2,2],[0,2],[2,2],[-1,3],[1,3]];
  heart.forEach(([hx,hy])=>p.add(hx*0.34,BY+8.4+hy*0.34,0.6,{c:0xff5d8f,s:0.36,e:2.0,d:0.94}));
  makeGroup('couple',p,{center:C[3],section:3,scatterR:34,swirl:3.4,floatAmp:0.035,pop:1.2});
  // mandala halo behind them
  const m=new Parts();
  for(let ring=0;ring<5;ring++){
    const rr=4.5+ring*2.1, petals=8+ring*4, n=Math.round(rr*10);
    for(let i=0;i<n;i++){
      const th=i/n*Math.PI*2;
      const wob=1+0.16*Math.sin(th*petals);
      const cols=[0xffc46b,0xff9a3d,0xff7ea8,0xb19bff,0xffe3ae];
      m.add(Math.cos(th)*rr*wob, 10+Math.sin(th)*rr*wob, 0, {c:cols[ring], s:R(0.32,0.55), e:0.9, d:ring*0.14+ (th/(Math.PI*2))*0.3});
    }
  }
  makeGroup('mandala',m,{center:[C[3][0],C[3][1],C[3][2]-10],section:3,scatterR:26,swirl:5,floatAmp:0.03,rot:(msh,dt)=>{msh.rotation.z+=dt*0.1;}});
}

/* ---- s4: haldi ---- */
function marigold(p, x,y,z, sc=1){
  for(let k=0;k<3;k++) p.add(x,y+k*0.7*sc,z,{c:0x4fae55,s:0.55*sc,d:0.3+k*0.06});
  p.add(x+0.6*sc,y+0.9*sc,z,{c:0x59c465,s:0.5*sc,d:0.42});
  const cy=y+2.4*sc;
  for(let i=0;i<16;i++){
    const th=R(Math.PI*2), ph=Math.acos(R(-1,1)), rr=R(0.35,0.85)*sc;
    p.add(x+Math.sin(ph)*Math.cos(th)*rr, cy+Math.cos(ph)*rr*0.85, z+Math.sin(ph)*Math.sin(th)*rr,
      {c:Math.random()<0.55?0xffb52e:0xff8c1a, s:R(0.38,0.6)*sc, e:R(0.35,0.7), d:0.5+rr*0.3+R(0.12)});
  }
  p.add(x,cy,z,{c:0xd96a10,s:0.5*sc,e:0.5,d:0.55});
}
function buildHaldi(){
  const p=new Parts();
  // courtyard
  const RAD=22;
  for(let gx=-RAD;gx<=RAD;gx++)for(let gz=-RAD;gz<=RAD;gz++){
    const d=Math.hypot(gx,gz); if(d>RAD) continue;
    const ring=Math.floor(d/5)%2===0;
    const c=ring? (((gx+gz)&1)?0xffd98f:0xf7c46b) : (((gx+gz)&1)?0xe8b458:0xd9a44a);
    p.add(gx,-0.5,gz,{c,s:1,e:d>RAD-1.4?0.6:0.05,d:(d/RAD)*0.6});
  }
  // toran gate facing the flight path
  for(let k=0;k<9;k++){ p.add(-6,k,12,{c:0xd8452e,s:1,e:0.1,d:0.25+k*0.05}); p.add(6,k,12,{c:0xd8452e,s:1,e:0.1,d:0.25+k*0.05}); }
  for(let i=-6;i<=6;i++){ p.add(i,9,12,{c:0xffc46b,s:1,e:0.5,d:0.6+Math.abs(i)*0.02});
    if(i%2===0){ const L=RI(1,3); for(let k=1;k<=L;k++) p.add(i,9-k,12.4,{c:k%2?0x59c465:0xffb52e,s:0.5,e:0.55,d:0.68+k*0.05}); } }
  // marigold field
  for(let i=0;i<70;i++){
    const th=R(Math.PI*2), rr=R(3,20);
    marigold(p, Math.cos(th)*rr, 0, Math.sin(th)*rr, R(0.8,1.25));
  }
  // the haldi sun
  for(let i=0;i<420;i++){
    const th=R(Math.PI*2), ph=Math.acos(R(-1,1)), rr=R(5.4,6.4);
    p.add(6+Math.sin(ph)*Math.cos(th)*rr, 24+Math.cos(ph)*rr, -26+Math.sin(ph)*Math.sin(th)*rr,
      {c:Math.random()<0.6?0xffd34e:0xffab2e, s:R(0.5,1), e:R(1.3,2.0), d:R(0.5,1)});
  }
  makeGroup('haldi',p,{center:C[4],section:4,scatterR:44,swirl:2.4,floatAmp:0.05});
  // floating turmeric blocks, forever rising
  const f=new Parts();
  for(let i=0;i<620;i++){
    const th=R(Math.PI*2), rr=R(2,17);
    f.add(Math.cos(th)*rr, R(0,22), Math.sin(th)*rr, {c:Math.random()<0.7?0xffd34e:0xffe9a8, s:R(0.28,0.62), e:R(0.5,1.1), d:Math.random()*0.6});
  }
  makeGroup('haldiRise',f,{center:C[4],section:4,flow:[2,1.6,22,0],scatterR:30,floatAmp:0.3});
}

/* ---- s5: mehendi ---- */
function buildMehendi(){
  const p=new Parts();
  // terrace floor
  const RAD=18;
  for(let gx=-RAD;gx<=RAD;gx++)for(let gz=-RAD;gz<=RAD;gz++){
    const d=Math.hypot(gx,gz); if(d>RAD) continue;
    const c=((Math.floor(gx/3)+Math.floor(gz/3))&1)?0x0f5c4a:0x0b4a3c;
    p.add(gx,-0.5,gz,{c:d>RAD-1.3?0xffc46b:c,s:1,e:d>RAD-1.3?0.5:0.04,d:(d/RAD)*0.55});
  }
  // jaali wall backdrop with circular cutouts
  for(let x=-15;x<=15;x++)for(let y=0;y<=15;y++){
    const hx=((x%5)+5)%5-2.5, hy=((y%5)+5)%5-2.5;
    if(Math.hypot(hx,hy)<1.7) continue;
    const frame=(Math.abs(x)===15||y===15||y===0);
    p.add(x,y,-14,{c:frame?0xffc46b:(((x+y)&1)?0x14735c:0x0f5c4a),s:1,e:frame?0.5:0.09,d:0.2+y*0.04+Math.abs(x)*0.01});
  }
  // henna vines crawling up the wall
  for(let v=0;v<11;v++){
    let vx=R(-14,14), sway=R(2,4), ph=R(Math.PI*2);
    const H=R(9,15);
    for(let k=0;k<H;k++){
      const yy=k*1.0, xx=vx+Math.sin(k*0.55+ph)*sway*0.4;
      p.add(xx,yy,-13,{c:0x2fbf8f,s:0.62,e:0.5,d:0.42+ (k/H)*0.5});
      if(k%3===1){ p.add(xx+R(-1,1),yy+0.4,-12.8,{c:0x5be3c8,s:0.5,e:0.7,d:0.5+(k/H)*0.5}); }
      if(k%4===2){ p.add(xx+R(-0.8,0.8),yy,-12.7,{c:0xff7ea8,s:0.45,e:1.1,d:0.55+(k/H)*0.5}); }
    }
  }
  // low seating: cushions + table
  const cush=[[-5,3],[5,3],[-7,-2],[7,-2],[0,6]];
  cush.forEach(([cx,cz],i)=>{
    const cc=[0xe05bff,0xff7ea8,0x5be3c8,0xffc46b,0xb19bff][i];
    for(let ox=-1;ox<=1;ox++)for(let oz=-1;oz<=1;oz++)p.add(cx+ox,0.2,cz+oz,{c:cc,s:0.92,e:0.14,d:0.5+R(0.2)});
    p.add(cx,0.9,cz,{c:cc,s:0.8,e:0.2,d:0.65});
  });
  for(let ox=-2;ox<=2;ox++)for(let oz=-1;oz<=1;oz++)p.add(ox,0.6,0.5,{c:0xffc46b,s:0.95,e:0.35,d:0.55});
  // hanging lanterns
  for(let i=0;i<7;i++){
    const lx=R(-13,13), lz=R(-10,6), ly=R(8,12);
    for(let k=0;k<3;k++)p.add(lx,ly+k*0.5+1.4,lz,{c:0x8a6540,s:0.2,d:0.6});
    p.add(lx,ly,lz,{c:0xffc46b,s:1,e:1.6,d:0.72});
    p.add(lx,ly+0.8,lz,{c:0xd8452e,s:0.7,e:0.4,d:0.7});
  }
  makeGroup('mehendi',p,{center:C[5],section:5,scatterR:40,swirl:2.8,floatAmp:0.045});
}

/* ---- s6: sangeet ---- */
function buildSangeet(){
  const p=new Parts();
  // dance floor
  for(let gx=-8;gx<=8;gx++)for(let gz=0;gz<=10;gz++){
    const c=((gx+gz)&1)?0xe05bff:0x35e0ff;
    p.add(gx*1.5,-0.5,gz*1.5-4,{c,s:1.32,e:0.28,d:R(0.5)});
  }
  // stage
  for(let gx=-12;gx<=12;gx++)for(let gz=-13;gz<=-6;gz++){
    const rim=(Math.abs(gx)===12||gz===-6||gz===-13);
    p.add(gx,0.6,gz,{c:rim?0xe05bff:0x1b1330,s:1,e:rim?1.1:0.06,d:0.2+R(0.25)});
  }
  // speaker stacks
  [[-14,-9],[14,-9]].forEach(([sx,sz])=>{
    for(let k=0;k<3;k++){ p.add(sx,1.8+k*1.6,sz,{c:0x11101f,s:1.5,d:0.4+k*0.1}); p.add(sx,1.8+k*1.6,sz+0.9,{c:0x35e0ff,s:0.6,e:1.4,d:0.5+k*0.1}); }
  });
  makeGroup('sangeet',p,{center:C[6],section:6,scatterR:42,swirl:3,floatAmp:0.03,beatGlow:0.9});
  // equaliser wall — columns keyed to the beat
  const eq=new Parts();
  for(let col=-12;col<=12;col++){
    const h=RI(3,9), colSeed=(col+40)*7.13;
    for(let zz=0;zz<2;zz++)for(let k=0;k<h;k++){
      _c.set(mixC(0x35e0ff,0xe05bff,k/9));
      eq.t.push(col,1.6+k,-14.5-zz);
      eq.c.push(_c.r,_c.g,_c.b);
      eq.d.push(0.95, 0.3+k*0.06, 0.5, colSeed);   // shared seed per column
    }
  }
  makeGroup('eqwall',eq,{center:C[6],section:6,eq:true,eqBase:1.1,scatterR:36,swirl:2,beatGlow:0.5});
  // disco cube
  const d=new Parts();
  for(let ox=-4;ox<=4;ox++)for(let oy=-4;oy<=4;oy++)for(let oz=-4;oz<=4;oz++){
    const dd=Math.hypot(ox,oy,oz); if(dd<3.1||dd>4.1) continue;
    d.add(ox,oy,oz,{c:Math.random()<0.7?0xf2f6ff:0x35e0ff,s:0.62,e:R(0.5,1.1),d:R(0.3,0.95)});
  }
  makeGroup('disco',d,{center:[C[6][0],C[6][1]+15,C[6][2]-8],section:6,scatterR:24,swirl:6,beatGlow:0.8,rot:(m,dt)=>{m.rotation.y+=dt*0.9;m.rotation.x+=dt*0.13;}});
  // floating lantern orbs ring
  const o=new Parts();
  for(let i=0;i<15;i++){
    const th=i/15*Math.PI*2, rr=19;
    for(let k=0;k<7;k++){
      const ox=R(-0.8,0.8),oy=R(-0.8,0.8),oz=R(-0.8,0.8);
      o.add(Math.cos(th)*rr+ox, 8+Math.sin(th*3)*2+oy, Math.sin(th)*rr*0.7-4+oz,
        {c:[0xe05bff,0x35e0ff,0xff7ea8][i%3],s:R(0.3,0.55),e:R(0.9,1.5),d:R(0.4,0.95)});
    }
  }
  makeGroup('orbs',o,{center:C[6],section:6,scatterR:30,floatAmp:0.2,beatGlow:0.6,rot:(m,dt)=>{m.rotation.y+=dt*0.16;}});
}

/* ---- s7: the wedding mandap ---- */
function buildWedding(){
  const p=new Parts();
  // stepped platform
  [[11,0],[9,1],[7,2]].forEach(([rr,lvl])=>{
    for(let gx=-rr;gx<=rr;gx++)for(let gz=-rr;gz<=rr;gz++){
      if(Math.max(Math.abs(gx),Math.abs(gz))>rr) continue;
      const rim=Math.max(Math.abs(gx),Math.abs(gz))>rr-1.2;
      p.add(gx,lvl,gz,{c:rim?0xffc46b:(((gx+gz)&1)?0x8f1d1d:0x7a1717),s:1,e:rim?0.55:0.05,d:0.06*lvl+Math.max(Math.abs(gx),Math.abs(gz))/rr*0.3});
    }
  });
  // aisle
  for(let gz=12;gz<=40;gz++)for(let gx=-2;gx<=2;gx++){
    const edge=Math.abs(gx)===2;
    p.add(gx,-0.2,gz,{c:edge?0xffc46b:0xa32222,s:1,e:edge?0.5:0.06,d:0.05+(40-gz)*0.012});
    if(edge&&gz%5===0){ p.add(gx*2.2,0.8,gz,{c:0x8a6540,s:0.7,d:0.3}); p.add(gx*2.2,1.7,gz,{c:0xffab2e,s:0.55,e:2.1,d:0.4}); }
  }
  // four pillars + capitals
  const PIL=[[-7,-7],[7,-7],[-7,7],[7,7]];
  PIL.forEach(([px,pz],pi)=>{
    for(let k=0;k<11;k++){
      const w=(k===0||k===10)?1.6:1.0;
      p.add(px,3+k,pz,{c:k%3===1?0xffc46b:0xd8452e,s:w,e:k%3===1?0.5:0.12,d:0.12+pi*0.05+k*0.028});
    }
  });
  // beams
  PIL.forEach(([px,pz],i)=>{
    const [qx,qz]=PIL[(i+1)%4===0? 0 : (i+1)%4]; // ring order -> fix below
  });
  const ringOrder=[[0,1],[1,3],[3,2],[2,0]];
  ringOrder.forEach(([a,b])=>{
    const [ax,az]=PIL[a],[bx,bz]=PIL[b];
    for(let i=0;i<=14;i++){
      const u=i/14;
      p.add(lerp(ax,bx,u),13.6,lerp(az,bz,u),{c:i%2?0xffc46b:0xd8452e,s:1.05,e:0.35,d:0.45+u*0.1});
    }
  });
  // shikhara dome: shrinking steps
  for(let lvl=0;lvl<6;lvl++){
    const rr=6-lvl;
    for(let gx=-rr;gx<=rr;gx++)for(let gz=-rr;gz<=rr;gz++){
      if(Math.max(Math.abs(gx),Math.abs(gz))!==rr && lvl<5) continue;   // shell only
      p.add(gx,14.6+lvl,gz,{c:lvl%2?0xffc46b:0xb32d20,s:1,e:0.4,d:0.55+lvl*0.05});
    }
  }
  p.add(0,21,0,{c:0xffe3ae,s:1.1,e:2.4,d:0.9}); p.add(0,22.1,0,{c:0xffe3ae,s:0.7,e:2.6,d:0.93});
  // garlands between pillar tops
  ringOrder.forEach(([a,b])=>{
    const [ax,az]=PIL[a],[bx,bz]=PIL[b];
    for(let i=0;i<=16;i++){
      const u=i/16, sag=-2.2*Math.sin(Math.PI*u);
      p.add(lerp(ax,bx,u),12.6+sag,lerp(az,bz,u),{c:i%2?0xffab2e:0xff8c1a,s:0.55,e:0.7,d:0.6+u*0.1});
    }
  });
  // hanging marigold strands from beams
  for(let i=0;i<14;i++){
    const u=R(-6,6), side=RI(0,1);
    const sx=side? u : (Math.random()<0.5?-7:7), sz=side? (Math.random()<0.5?-7:7) : u;
    const L=RI(3,6);
    for(let k=1;k<=L;k++) p.add(sx,13.6-k*0.8,sz,{c:k%2?0xffab2e:0xffd34e,s:0.5,e:0.65,d:0.62+k*0.045});
  }
  // sacred fire pit
  for(let a=0;a<14;a++){const th=a/14*Math.PI*2;p.add(Math.cos(th)*1.9,3.1,Math.sin(th)*1.9,{c:0xa86a2e,s:0.8,e:0.2,d:0.5});}
  makeGroup('mandap',p,{center:C[7],section:7,scatterR:52,swirl:2.2,floatAmp:0.028});
  // fire — rising, flickering embers
  const f=new Parts();
  for(let i=0;i<240;i++){
    const yy=R(0,4.6), rad=1.5*(1-yy/5)+0.12;
    const th=R(Math.PI*2), rr=R(0,rad);
    f.add(Math.cos(th)*rr, 3.4+yy, Math.sin(th)*rr,
      {c:mixC(0xffe9a8,0xff4d1a,Math.min(1,yy/4.4)), s:R(0.3,0.6)*(1-yy*0.12), e:R(1.6,2.6), d:R(0.5)});
  }
  makeGroup('fire',f,{center:C[7],section:7,flow:[2,2.6,4.8,3.4],floatAmp:0.5,scatterR:20});
  // falling petals
  const pe=new Parts();
  for(let i=0;i<430;i++){
    pe.add(R(-16,16), R(0,26), R(-14,30), {c:Math.random()<0.5?0xff9db8:0xfff0e0, s:R(0.24,0.44), e:R(0.25,0.5), d:R(0.6)});
  }
  makeGroup('petals',pe,{center:C[7],section:7,flow:[1,1.5,26,0],floatAmp:0.4,scatterR:30});

const BN=800;
let burstG=null;
const bPos=new Float32Array(BN*3), bVel=new Float32Array(BN*3), bLife=new Float32Array(BN);
let bIdx=0;
function buildBursts(){
  const p=new Parts();
  for(let i=0;i<BN;i++) p.add(0,-9999,0,{c:0xffc46b,s:0,e:1.4,d:0});
  burstG=makeGroup('bursts',p,{center:[0,0,0],section:0,persist:true,scatterR:0,swirl:0,floatAmp:0,dynamic:true,noCollapse:true});

}
function spawnBurst(wx,wy,wz,color,n=4){
  for(let k=0;k<n;k++){
    const i=bIdx=(bIdx+1)%BN;
    bPos[i*3]=wx+R(-0.4,0.4); bPos[i*3+1]=wy+R(-0.4,0.4); bPos[i*3+2]=wz+R(-0.4,0.4);
    bVel[i*3]=R(-2.4,2.4); bVel[i*3+1]=R(2,6); bVel[i*3+2]=R(-2.4,2.4);
    bLife[i]=R(0.8,1.5);
    _c.set(color);
    const cA=burstG.mesh.geometry.attributes.aColor;
    cA.array[i*3]=_c.r; cA.array[i*3+1]=_c.g; cA.array[i*3+2]=_c.b;
    cA.needsUpdate=true;
  }
}
function updateBursts(dt){
  const tA=burstG.mesh.geometry.attributes.aTarget, dA=burstG.mesh.geometry.attributes.aData;
  for(let i=0;i<BN;i++){
    if(bLife[i]<=0){ if(dA.array[i*4]!==0){dA.array[i*4]=0;dA.needsUpdate=true;} continue; }
    bLife[i]-=dt;
    bVel[i*3+1]-=5.4*dt;
    bPos[i*3]+=bVel[i*3]*dt; bPos[i*3+1]+=bVel[i*3+1]*dt; bPos[i*3+2]+=bVel[i*3+2]*dt;
    tA.array[i*3]=bPos[i*3]; tA.array[i*3+1]=bPos[i*3+1]; tA.array[i*3+2]=bPos[i*3+2];
    dA.array[i*4]=Math.max(0,Math.min(0.42,bLife[i]*0.42));
  }
  tA.needsUpdate=true; dA.needsUpdate=true;
}

function scrollable(){ return document.documentElement.scrollHeight-innerHeight; }
addEventListener('scroll',()=>{ tTarget=Math.min(1,Math.max(0,scrollY/Math.max(1,scrollable()))); },{passive:true});
function smoothJumpTo(t){ scrollTo({top:t*scrollable(),behavior:'smooth'}); }

function envSection(k,t){
  const t0=k*S;
  let p=ssm(t0-0.018,t0+0.052,t);
  if(k<NS-1){ const tn=(k+1)*S; p*=1-ssm(tn+0.015,tn+0.062,t); }
  return p;
}
function groupProgress(g,t){
  let p;
  if(g.buildRange){ p=ssm(g.buildRange[0],g.buildRange[1],t); }
  else if(g.persist){ p=ssm(0.085,0.16,t); }
  else p=envSection(g.section,t);
  if(!g.noCollapse) p*=1-ssm(0.902,0.948,t);   // the great collapse
  return p;
}

/* ================================================================
   GENERATIVE AUDIO — ambient pad + sangeet beat (all synthesized)
   ================================================================ */
const BPM=100;
const snd={on:false,ctx:null};
function sndEnsure(){
  if(snd.ctx) return;
  const A=new (window.AudioContext||window.webkitAudioContext)();
  snd.ctx=A;
  snd.master=A.createGain(); snd.master.gain.value=0; snd.master.connect(A.destination);
  // generated impulse reverb
  const ir=A.createBuffer(2,A.sampleRate*2.6,A.sampleRate);
  for(let ch=0;ch<2;ch++){ const d=ir.getChannelData(ch);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.6); }
  snd.rev=A.createConvolver(); snd.rev.buffer=ir;
  snd.revG=A.createGain(); snd.revG.gain.value=0.5;
  snd.rev.connect(snd.revG); snd.revG.connect(snd.master);
  // pad
  snd.lp=A.createBiquadFilter(); snd.lp.type='lowpass'; snd.lp.frequency.value=640; snd.lp.Q.value=0.4;
  snd.padG=A.createGain(); snd.padG.gain.value=0.9;
  snd.lp.connect(snd.padG); snd.padG.connect(snd.master); snd.padG.connect(snd.rev);
  const lfo=A.createOscillator(), lfoG=A.createGain();
  lfo.frequency.value=0.07; lfoG.gain.value=210; lfo.connect(lfoG); lfoG.connect(snd.lp.frequency); lfo.start();
  snd.chords=[[110,164.81,261.63,329.63,440],[87.31,174.61,220,293.66,440]];
  snd.oscs=snd.chords[0].map(f=>{
    const o=A.createOscillator(), g=A.createGain();
    o.type='sawtooth'; o.frequency.value=f; o.detune.value=R(-7,7);
    g.gain.value=0.016; o.connect(g); g.connect(snd.lp); o.start();
    return o;
  });
  snd.chordAt=A.currentTime+11; snd.chordIdx=0;
  snd.pluckAt=A.currentTime+2;
  // beat bus
  snd.beatG=A.createGain(); snd.beatG.gain.value=0; snd.beatG.connect(snd.master);
  const nb=A.createBuffer(1,A.sampleRate*0.5,A.sampleRate);
  const nd=nb.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
  snd.noise=nb;
  snd.nextBeat=A.currentTime+0.1; snd.beatCount=0;
}
function sndToggle(){
  sndEnsure();
  const A=snd.ctx;
  if(A.state==='suspended') A.resume();
  snd.on=!snd.on;
  snd.master.gain.setTargetAtTime(snd.on?0.5:0, A.currentTime, 0.6);
  document.getElementById('sndBtn').classList.toggle('on',snd.on);
}
document.getElementById('sndBtn').addEventListener('click',sndToggle);
const PENT=[440,523.25,587.33,659.25,783.99,880];
function sndUpdate(sangW){
  if(!snd.ctx||!snd.on) return;
  const A=snd.ctx, now=A.currentTime;
  if(now>snd.chordAt){
    snd.chordIdx=1-snd.chordIdx;
    snd.chords[snd.chordIdx].forEach((f,i)=>snd.oscs[i].frequency.setTargetAtTime(f,now,2.2));
    snd.chordAt=now+11+R(4);
  }
  if(now>snd.pluckAt){
    const o=A.createOscillator(), g=A.createGain();
    o.type='triangle'; o.frequency.value=PENT[RI(0,5)]*(Math.random()<0.4?0.5:1);
    g.gain.setValueAtTime(0.0001,now); g.gain.exponentialRampToValueAtTime(0.055,now+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,now+1.5);
    o.connect(g); g.connect(snd.rev); g.connect(snd.master);
    o.start(now); o.stop(now+1.6);
    snd.pluckAt=now+R(2.5,7);
  }
  snd.beatG.gain.setTargetAtTime(sangW*0.95,now,0.4);
  if(sangW>0.02){
    while(snd.nextBeat<now+0.18){
      const t0=Math.max(snd.nextBeat,now);
      if(snd.beatCount%2===0){ // kick on quarters
        const o=A.createOscillator(), g=A.createGain();
        o.frequency.setValueAtTime(150,t0); o.frequency.exponentialRampToValueAtTime(44,t0+0.11);
        g.gain.setValueAtTime(0.6,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+0.3);
        o.connect(g); g.connect(snd.beatG); o.start(t0); o.stop(t0+0.32);
      }else{ // offbeat hat
        const s=A.createBufferSource(); s.buffer=snd.noise;
        const hp=A.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7200;
        const g=A.createGain(); g.gain.setValueAtTime(0.13,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+0.055);
        s.connect(hp); hp.connect(g); g.connect(snd.beatG); s.start(t0); s.stop(t0+0.08);
      }
      snd.beatCount++; snd.nextBeat+=60/BPM/2;
    }
  }else{ snd.nextBeat=now+0.1; }
}
function beatEnv(){
  const bt=(snd.ctx&&snd.on)? snd.ctx.currentTime : clockT;
  const ph=(bt*BPM/60)%1;
  return Math.pow(1-ph,2.6);
}

/* ================================================================
   MAIN LOOP
   ================================================================ */
const clock=new THREE.Clock();
const lookSm=new THREE.Vector3(0,3.2,0);
const _v=new THREE.Vector3(), _v2=new THREE.Vector3(), _fog=new THREE.Color(), _fogT=new THREE.Color();
let frameN=0, accum=0, lastQ=0;

function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(0.05,clock.getDelta());
  clockT+=dt;

  if(touring){ scrollTo(0, scrollY + dt*scrollable()/165); if(tSmooth>0.997) tourOff(); }

  tSmooth+=(tTarget-tSmooth)*Math.min(1,dt*4.2);
  const t=tSmooth;
  const k=curSection();
  const beat=beatEnv();
  const sangW=envSection(6,t);
  const finaleW=ssm(0.900,0.945,t);

  /* fog color per section */
  _fog.set(SECTIONS[k].fog);
  const kn=Math.min(NS-1,k+1), u=(t-k*S)/S;
  _fogT.set(SECTIONS[kn].fog); _fog.lerp(_fogT,ssm(0.7,1,u));
  renderer.setClearColor(_fog);

  /* camera along the grand tour */
  const cp=camCurve.getPoint(Math.min(1,Math.max(0,t)));
  const ahead=camCurve.getPoint(Math.min(1,t+0.012));
  const w=ssm(0.06,0.26,u)*(1-ssm(0.7,0.97,u));
  _v.copy(ahead).lerp(FOCUS[k],w*0.85);
  lookSm.lerp(_v,Math.min(1,dt*3.2));
  camera.position.copy(cp);
  camera.position.y+=Math.sin(clockT*0.5)*0.35;
  camera.position.x+=ndc.x*1.1; camera.position.y+=ndc.y*0.7;
  camera.lookAt(lookSm);

  /* mouse world point: along the view ray toward this section's focus */
  if(mouseActive){
    ray.setFromCamera(ndc,camera);
    const fd=Math.min(70,Math.max(9,camera.position.distanceTo(FOCUS[k])*0.62));
    mouseWorld.copy(camera.position).addScaledVector(ray.ray.direction,fd);
  } else mouseWorld.set(0,-9999,0);
  mouseMoveAmt=mouseWorld.distanceTo(mousePrev);
  if(mouseActive&&mouseMoveAmt>0.6&&t>0.03&&t<0.92){
    spawnBurst(mouseWorld.x,mouseWorld.y,mouseWorld.z,BURST_COLORS[k],Math.min(5,mouseMoveAmt|0));
  }
  mousePrev.copy(mouseWorld);

  /* groups */
  for(const g of groups){
    const p=groupProgress(g,t);
    const vis=p>0.002;
    g.mesh.visible=vis;
    if(!vis) continue;
    const U=g.u;
    U.uTime.value=clockT;
    if(g!==burstG) U.uProgress.value=p;
    U.uBeat.value=beat;
    U.uSuck.value=Math.max(g.suckBase,finaleW);
    if(finaleW>0&&g.suckBase===0){
      U.uSuckPoint.value.set(C[9][0]-g.mesh.position.x, C[9][1]+4-g.mesh.position.y, C[9][2]-g.mesh.position.z);
    }
    U.uMouse.value.copy(mouseWorld).sub(g.mesh.position);
    U.uClick.value.set(clickWorld.x-g.mesh.position.x, clickWorld.y-g.mesh.position.y, clickWorld.z-g.mesh.position.z, clickTime);
    U.uFogColor.value.copy(_fog);
    U.uFogDensity.value=FOG_BASE*g.fogMul*(1-0.7*finaleW);
    if(g.rot) g.rot(g.mesh,dt*(g.name==='disco'?(0.3+sangW):1));
  }
  updateBursts(dt);

  /* seed cube: genesis + return */
  const genesisEnv=(1-ssm(0.20,0.26,t));
  const returnEnv=ssm(0.928,0.965,t);
  if(returnEnv>0){ seedCube.position.set(C[9][0],C[9][1]+4,C[9][2]); }
  else seedCube.position.set(...C[0]);
  const pulse=1+Math.sin(clockT*2.4)*0.09+beat*0.05;
  const sscl=Math.max(genesisEnv,returnEnv)*pulse;
  seedCube.visible=sscl>0.01;
  seedCube.scale.setScalar(Math.max(0.001,sscl));
  seedCube.rotation.y+=dt*0.7; seedCube.rotation.x+=dt*0.33;
  halos.forEach(h=>{ const o=h.env(t); h.sprite.visible=o>0.01; h.sprite.material.opacity=Math.min(1,o)*0.85; });
  // finale halo follows the returned cube
  halos[5].sprite.position.copy(seedCube.position);
  halos[0].sprite.position.set(...C[0]);

  /* HUD */
  intro.style.opacity=1-ssm(0.012,0.05,t);
  intro.style.visibility=t>0.06?'hidden':'visible';
  chapterEls.forEach((elm,i)=>{
    if(!elm) return;
    const t0=i*S, uu=(t-t0)/S;
    const op=ssm(0.08,0.3,uu)*(1-ssm(0.72,0.95,uu));
    elm.style.opacity=op;
    elm.style.visibility=op>0.01?'visible':'hidden';
    const dy=(1-op)*26;
    elm.style.marginTop=dy+'px';
  });
  Object.entries(eventEls).forEach(([sec,elm])=>{
    const t0=sec*S, uu=(t-t0)/S;
    const op=ssm(0.14,0.34,uu)*(1-ssm(0.74,0.95,uu));
    elm.style.opacity=op;
    elm.style.visibility=op>0.01?'visible':'hidden';
    elm.style.marginTop=((1-op)*30)+'px';
  });
  const finOp=ssm(0.955,0.985,t);
  finale.style.opacity=finOp;
  finale.style.pointerEvents=finOp>0.5?'auto':'none';
  dots.forEach((d,i)=>d.classList.toggle('active',i===k));
  /* cursor */
  ringX+=(curX-ringX)*Math.min(1,dt*10); ringY+=(curY-ringY)*Math.min(1,dt*10);
  curEl.style.transform=`translate(${curX-3}px,${curY-3}px)`;
  ringEl.style.transform=`translate(${ringX-15}px,${ringY-15}px) rotate(45deg)`;

  sndUpdate(sangW);

  /* adaptive quality */
  accum+=dt; frameN++;
  if(frameN>=50){
    const avg=accum/frameN;
    if(avg>0.034&&dprScale>0.62&&clockT-lastQ>3){
      dprScale*=0.8; lastQ=clockT;
      renderer.setPixelRatio(maxDPR*dprScale);
      composer.setPixelRatio?.(maxDPR*dprScale);
      composer.setSize(innerWidth,innerHeight);
    }
    accum=0; frameN=0;
  }

  composer.render();
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
  bloom.resolution.set(innerWidth,innerHeight);
});

/* ================================================================
   BOOT — build worlds in chunks behind the loader
   ================================================================ */
const BUILDERS=[buildStars,buildDust,buildGalaxy,buildNames,buildIslands,buildCouple,
  buildHaldi,buildMehendi,buildSangeet,buildWedding,buildReception,buildFinale,buildBursts,buildSeedCube,buildHalos];
const lbar=document.querySelector('#lbar i');
let bi=0;
function buildStep(){
  if(bi<BUILDERS.length){
    BUILDERS[bi](); bi++;
    lbar.style.width=((bi/BUILDERS.length)*100)+'%';
    setTimeout(buildStep,10);
  }else{
    document.getElementById('finFoot').textContent=`This universe was assembled from ${totalVoxels.toLocaleString('en-IN')} blocks of love — and it would be incomplete without you.`;
    document.getElementById('loader').classList.add('done');
    document.body.classList.add('ready');
    tTarget=Math.min(1,Math.max(0,scrollY/Math.max(1,scrollable())));
    tSmooth=tTarget;
    clock.getDelta();
    tick();
  }
}
buildStep();

/* debug hook for deterministic states */
window.__vv={ jump(t){ tourOff(); scrollTo(0,t*scrollable()); tTarget=t; tSmooth=t; }, get t(){return tSmooth;}, voxels:()=>totalVoxels };
</script>
